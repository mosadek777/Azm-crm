<div class="w-full max-w-sm mx-auto bg-white border border-surface-200 rounded-xl p-6 shadow-sm">
  <!-- No language toggle here: the shell header carries the only one, so the
       two are not competing for the same job on the same screen. -->
  <h1 class="text-2xl font-semibold text-surface-900 mb-6">
    {{ 'portal.signIn' | translate: i18n.lang() }}
  </h1>

  <form (ngSubmit)="submit()">
    <label for="portal-email" class="block text-sm text-surface-700 mb-1">
      {{ 'portal.email' | translate: i18n.lang() }}
    </label>
    <!-- dir="ltr" on the input itself: an email address does not reverse, even
         inside a mirrored layout (spec 012 AS-04, 008 §8). -->
    <input id="portal-email" type="email" name="email" dir="ltr" autocomplete="username"
      class="w-full border border-surface-300 rounded-lg px-3 py-2 mb-4
             focus:outline-none focus:ring-2 focus:ring-primary-500"
      [ngModel]="email()" (ngModelChange)="email.set($event)" />

    <label for="portal-password" class="block text-sm text-surface-700 mb-1">
      {{ 'portal.password' | translate: i18n.lang() }}
    </label>
    <div class="mb-5">
      <app-password-field
        inputId="portal-password"
        autocomplete="current-password"
        [(value)]="password" />
    </div>

    @if (refusal(); as message) {
      <p role="alert" class="mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
        {{ i18n.lang() === 'ar' ? message.ar : message.en }}
      </p>
    }

    <button type="submit" [disabled]="submitting()"
      class="w-full bg-primary-600 hover:bg-primary-700 disabled:opacity-60
             text-white rounded-lg py-2.5 font-medium">
      {{ (submitting() ? 'portal.submitting' : 'portal.signIn') | translate: i18n.lang() }}
    </button>
  </form>

  <p class="mt-5 text-xs text-surface-500 text-center">
    {{ 'portal.noAccount' | translate: i18n.lang() }}
  </p>
</div>
