<a routerLink="/portal/tickets" class="text-sm text-primary-700 hover:underline">
  ← {{ 'portal.backToList' | translate: i18n.lang() }}
</a>

<h1 class="mt-4 mb-5 text-xl font-semibold text-surface-900">
  {{ 'portal.newRequest' | translate: i18n.lang() }}
</h1>

<!-- mx-auto: constrained for readability AND centred. Constrained alone left
     it against the start edge of a much wider shell. -->
<form (ngSubmit)="submit()" class="bg-white border border-surface-200 rounded-xl p-5">
  <!-- The card spans the page measure so its edges align with the header; the
       fields inside stay a readable width. Constraining the card instead would
       put its start edge 185px inside the header's, which is what read as
       "not centred". -->
  <div class="max-w-2xl">
  <label for="req-subject" class="block text-sm text-surface-700 mb-1">
    {{ 'portal.subject' | translate: i18n.lang() }}
  </label>
  <input id="req-subject" name="subject"
    class="w-full border border-surface-300 rounded-lg px-3 py-2 mb-4
           focus:outline-none focus:ring-2 focus:ring-primary-500"
    [ngModel]="subject()" (ngModelChange)="subject.set($event)" />

  <label for="req-category" class="block text-sm text-surface-700 mb-1">
    {{ 'portal.category' | translate: i18n.lang() }}
  </label>
  <select id="req-category" name="category"
    class="w-full border border-surface-300 rounded-lg px-3 py-2 mb-4 bg-white
           focus:outline-none focus:ring-2 focus:ring-primary-500"
    [ngModel]="category()" (ngModelChange)="category.set($event)">
    <option value=""></option>
    @for (c of categories; track c) {
      <option [value]="c">{{ c }}</option>
    }
  </select>

  <label for="req-description" class="block text-sm text-surface-700 mb-1">
    {{ 'portal.describe' | translate: i18n.lang() }}
  </label>
  <textarea id="req-description" name="description" rows="5"
    class="w-full border border-surface-300 rounded-lg px-3 py-2 mb-5
           focus:outline-none focus:ring-2 focus:ring-primary-500"
    [ngModel]="description()" (ngModelChange)="description.set($event)"></textarea>

  @if (refusal(); as message) {
    <p role="alert" class="mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
      {{ i18n.lang() === 'ar' ? message.ar : message.en }}
    </p>
  }

  <div class="flex items-center gap-3">
    <button type="submit" [disabled]="submitting()"
      class="bg-primary-600 hover:bg-primary-700 disabled:opacity-60
             text-white rounded-lg px-5 py-2.5 font-medium">
      {{ (submitting() ? 'portal.submittingRequest' : 'portal.submit') | translate: i18n.lang() }}
    </button>
    <a routerLink="/portal/tickets" class="text-sm text-surface-600 hover:underline">
      {{ 'portal.cancel' | translate: i18n.lang() }}
    </a>
  </div>
  </div>
</form>
