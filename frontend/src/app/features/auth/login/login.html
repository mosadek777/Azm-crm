<!-- THE FROSTED CARD. Values verbatim from the borrowed system's section 4:
     bg-white/[0.07], border-white/15, backdrop-blur-xl, rounded-2xl,
     shadow-2xl shadow-black/40, p-6 rising to p-8 from sm.

     THE BORDER MUST BE LIGHTER THAN THE FILL. 15% over 7% is what makes the
     panel read as a pane of glass rather than as a hole cut in the photograph.
     This is the one place the "separation is a border, never a shadow" rule is
     set aside — the card floats over an image, which is exactly the case a
     shadow is for, and the source specifies one.

     Every directional utility is logical (ms-/me-/ps-/pe-, start/end,
     border-s-), so the card mirrors under dir="rtl" — spec 012 FR-002. -->
<div class="w-full rounded-2xl border border-white/15 bg-white/[0.07] p-6
            shadow-2xl shadow-black/40 backdrop-blur-xl sm:p-8">
  <form class="flex flex-col gap-6" (ngSubmit)="submit()">

    <h1 class="m-0 text-2xl font-semibold text-white">
      {{ 'login.title' | translate: i18n.lang() }}
    </h1>

    <label class="flex flex-col gap-1.5">
      <span class="text-sm font-medium text-white/80">
        {{ 'login.email' | translate: i18n.lang() }}
      </span>
      <!-- dir="ltr" and text-start: an email address is a direction-neutral
           value, so it stays LTR inside an Arabic layout (FR-002, AS-04) while
           still aligning to the reading edge of the field. -->
      <input
        type="email"
        name="email"
        dir="ltr"
        autocomplete="username"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        class="w-full rounded-lg border border-white/15 bg-white/5 px-3 py-2 text-start
               text-white placeholder:text-white/35
               focus:border-white/25 focus:outline-none focus:ring-2 focus:ring-primary-500/50
               motion-safe:transition-colors" />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-sm font-medium text-white/80">
        {{ 'login.password' | translate: i18n.lang() }}
      </span>
      <app-password-field
        inputId="password"
        autocomplete="current-password"
        [(value)]="password" />
    </label>

    @if (refusal(); as message) {
      <!-- Rendered as the server sent it. Dark-surface reds rather than the
           light-page reds used elsewhere: on glass, bg-red-50 was a bright slab
           that read as the loudest thing on the screen. -->
      <p class="m-0 rounded-lg border-s-4 border-red-400 bg-red-950/60 px-3 py-2 text-sm text-red-100"
         role="alert">
        {{ message[i18n.lang()] }}
      </p>
    }

    <!-- The primary action of the view — item 1 of the loud-colour list, and it
         keeps its violet on the dark card rather than turning white. -->
    <button
      type="submit"
      [disabled]="submitting()"
      class="w-full rounded-lg bg-primary-600 px-4 py-2.5 text-base font-semibold text-white
             hover:bg-primary-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-400
             disabled:cursor-default disabled:opacity-60 motion-safe:transition-colors">
      {{ (submitting() ? 'login.submitting' : 'login.submit') | translate: i18n.lang() }}
    </button>

    <p class="m-0 text-center text-sm text-white/60">
      {{ 'login.noAccount' | translate: i18n.lang() }}
    </p>
  </form>
</div>
