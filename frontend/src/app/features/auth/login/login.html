<!-- Tailwind only. Every directional utility is logical (ms-/me-/ps-/pe-,
     start/end, border-s-), so the whole card mirrors under dir="rtl" with no
     override sheet — spec 012 FR-002. -->
<div class="w-[26rem] max-w-[92vw] rounded-xl bg-surface-0 shadow-xl shadow-surface-900/5
            ring-1 ring-surface-200 p-8">
  <form class="flex flex-col gap-6" (ngSubmit)="submit()">

    <div class="flex items-baseline justify-between gap-3">
      <h1 class="m-0 text-2xl font-semibold tracking-tight text-surface-900">
        {{ 'login.title' | translate: i18n.lang() }}
      </h1>
    </div>

    <label class="flex flex-col gap-1.5">
      <span class="text-sm font-medium text-surface-700">
        {{ 'login.email' | translate: i18n.lang() }}
      </span>
      <!-- dir="ltr" and text-start: an email address is a direction-neutral
           value, so it stays LTR inside an Arabic layout (FR-002, AS-04) while
           still aligning to the reading edge of the field. -->
      <input
        type="email"
        name="email"
        dir="ltr"
        autocomplete="username"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        class="w-full rounded-lg border border-surface-300 bg-surface-0 px-3 py-2 text-start
               text-surface-900 placeholder:text-surface-400
               focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/25
               transition-colors" />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-sm font-medium text-surface-700">
        {{ 'login.password' | translate: i18n.lang() }}
      </span>
      <app-password-field
        inputId="password"
        autocomplete="current-password"
        [(value)]="password" />
    </label>

    @if (refusal(); as message) {
      <p class="m-0 rounded-lg border-s-4 border-red-600 bg-red-50 px-3 py-2 text-sm text-red-800"
         role="alert">
        {{ message[i18n.lang()] }}
      </p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="w-full rounded-lg bg-primary-600 px-4 py-2.5 text-base font-semibold text-white
             hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500/40
             disabled:opacity-60 disabled:cursor-default transition-colors">
      {{ (submitting() ? 'login.submitting' : 'login.submit') | translate: i18n.lang() }}
    </button>

    <p class="m-0 text-center text-sm text-surface-500">
      {{ 'login.noAccount' | translate: i18n.lang() }}
    </p>
  </form>
</div>
