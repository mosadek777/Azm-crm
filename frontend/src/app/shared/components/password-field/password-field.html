<div class="relative">
  <!-- pe-11 reserves room for the button on the END edge, so the value never
       runs underneath it. Logical, so it is the right edge in English and the
       left in Arabic without a second rule. -->
  <input [id]="inputId()" [name]="inputId()" dir="ltr" [autocomplete]="autocomplete()"
    [type]="revealed() ? 'text' : 'password'"
    class="w-full border border-surface-300 rounded-lg px-3 py-2 pe-11
           focus:outline-none focus:ring-2 focus:ring-primary-500"
    [ngModel]="value()" (ngModelChange)="value.set($event)" />

  <button type="button"
    class="absolute inset-y-0 end-0 flex w-11 items-center justify-center
           text-surface-500 hover:text-surface-800
           focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 rounded-e-lg"
    [attr.aria-label]="(revealed() ? 'login.hide' : 'login.show') | translate: i18n.lang()"
    [attr.aria-pressed]="revealed()"
    [attr.aria-controls]="inputId()"
    (click)="revealed.set(!revealed())">

    @if (revealed()) {
      <!-- eye with a slash: currently visible, pressing hides it again -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3l18 18" />
        <path d="M10.6 10.6a2 2 0 002.8 2.8" />
        <path d="M9.4 5.2A9.6 9.6 0 0112 5c5 0 9 4.5 9 7a11 11 0 01-2.4 3.5" />
        <path d="M6.2 6.7C4 8.2 3 10.4 3 12c0 2.5 4 7 9 7a9.6 9.6 0 003.5-.7" />
      </svg>
    } @else {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12s3.6-7 9-7 9 7 9 7-3.6 7-9 7-9-7-9-7z" />
        <circle cx="12" cy="12" r="2.6" />
      </svg>
    }
  </button>
</div>
