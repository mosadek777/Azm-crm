<!-- dir="ltr" on the WRAPPER, not on the input alone. A password is a
     direction-neutral value: in an Arabic context a password ending in `_`
     rendered with the underscore at the start, so what the user typed and what
     they saw disagreed and they could not sign in. Masking does not save it —
     the caret and the insertion point follow the field's direction whether the
     glyphs are dots or characters, and the Show control reveals the reversed
     value outright.

     An earlier version put dir="ltr" on the input only. That was reverted
     because it broke the layout, and the revert was the wrong fix for a real
     problem: end-0 on the button resolves against the PAGE direction and moved
     to the left edge in Arabic, while the input's own padding-inline-end stayed
     on the right — padding on one edge, icon on the other, value under the
     glyph. Pinning the wrapper puts the input, its padding and the button in
     ONE direction context, so all three agree in both languages.

     ps-3 pe-11, NOT px-3 pe-11. In Tailwind v4 px-* emits the padding-inline
     SHORTHAND, which overrides the padding-inline-end longhand that pe-* emits,
     so px-3 pe-11 silently collapses the reserved space back to 12px and the
     value runs under the icon. -->
<div class="relative" dir="ltr">
  <!-- [attr.name], not [name]: with ngModel present Angular treats `name` as
       the NgModel control name and the DOM attribute was never written, leaving
       the field nameless. A password input with no name is skipped by browser
       autofill and by password managers. ngModelOptions standalone keeps it out
       of the surrounding NgForm, which is what wanted the name in the first
       place — the parent component owns the value through the model signal. -->
  <input [id]="inputId()" [attr.name]="inputId()" [autocomplete]="autocomplete()"
    [type]="revealed() ? 'text' : 'password'"
    class="w-full border border-surface-300 rounded-lg py-2 ps-3 pe-11
           focus:outline-none focus:ring-2 focus:ring-primary-500"
    [ngModel]="value()" (ngModelChange)="value.set($event)"
    [ngModelOptions]="{ standalone: true }" />

  <button type="button"
    class="absolute inset-y-0 end-0 flex w-11 items-center justify-center
           text-surface-500 hover:text-surface-800
           focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500 rounded-e-lg"
    [attr.aria-label]="(revealed() ? 'login.hide' : 'login.show') | translate: i18n.lang()"
    [attr.aria-pressed]="revealed()"
    [attr.aria-controls]="inputId()"
    (click)="revealed.set(!revealed())">

    @if (revealed()) {
      <!-- eye with a slash: currently visible, pressing hides it again -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3l18 18" />
        <path d="M10.6 10.6a2 2 0 002.8 2.8" />
        <path d="M9.4 5.2A9.6 9.6 0 0112 5c5 0 9 4.5 9 7a11 11 0 01-2.4 3.5" />
        <path d="M6.2 6.7C4 8.2 3 10.4 3 12c0 2.5 4 7 9 7a9.6 9.6 0 003.5-.7" />
      </svg>
    } @else {
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12s3.6-7 9-7 9 7 9 7-3.6 7-9 7-9-7-9-7z" />
        <circle cx="12" cy="12" r="2.6" />
      </svg>
    }
  </button>
</div>
