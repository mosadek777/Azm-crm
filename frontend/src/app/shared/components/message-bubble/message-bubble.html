<!-- One message. See message-bubble.ts for why this is shared between the staff
     thread and the customer portal, and for the only two things that differ. -->
<li [class]="rowClass()">
  <article [class]="bubbleClass()">

    <p class="m-0 mb-1 flex flex-wrap items-baseline gap-2 text-xs text-surface-500">
      <!-- Who. A role or an organisation label, never an individual agent on
           the portal side — the caller decides which. -->
      <span [class]="authorClass()">
        {{ authorKey() | translate: i18n.lang() }}
      </span>

      <!-- When. A timestamp is a direction-neutral value and does not reverse
           inside Arabic text. -->
      @if (sentAt()) {
        <span dir="ltr" class="text-surface-400">{{ sentAt() | date: 'short' }}</span>
      }

      <!-- Staff only. The chip is text as well as colour, so an internal note
           is identifiable without distinguishing amber from grey. -->
      @if (showVisibility()) {
        @if (internal()) {
          <span class="rounded-full bg-amber-100 px-2 py-0.5 font-medium text-amber-900">
            {{ 'ticket.internal' | translate: i18n.lang() }}
          </span>
        } @else {
          <span class="rounded-full bg-surface-100 px-2 py-0.5 text-surface-700">
            {{ 'ticket.customerVisible' | translate: i18n.lang() }}
          </span>
        }
      }
    </p>

    <!-- User-authored content: single language, and its direction is the
         MESSAGE's, not the interface's.

         `dir="auto"` is what makes that true, and it is load-bearing rather
         than decorative. 008 AS-10: "a ticket thread containing both Arabic and
         English messages renders each message in its own direction."

         ⚠ THIS COMMENT USED TO CLAIM THE BEHAVIOUR WITHOUT IMPLEMENTING IT —
         it said direction was "detected per message by the browser rather than
         forced", and no dir attribute existed anywhere in this component, so
         every message simply inherited the page. Browsers do NOT detect
         direction on their own; `auto` is the opt-in, and it resolves from the
         first strongly-directional character. Measured before the fix, at
         1400px: an Arabic reply inside the English interface computed
         direction:ltr and hung its full stop on the left; an English reply
         inside the Arabic interface computed direction:rtl and did the same
         with its question mark. Both are the exact defect AS-10 names.

         `whitespace-pre-wrap` so the line breaks somebody typed survive — they
         did on the portal and were collapsed on the staff side, which is one of
         the differences this component removes. -->
    <p dir="auto" class="m-0 whitespace-pre-wrap text-sm text-surface-900">{{ body() }}</p>
  </article>
</li>
