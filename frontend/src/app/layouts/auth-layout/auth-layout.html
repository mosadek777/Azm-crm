<div class="min-h-screen flex flex-col bg-surface-100">
  <!-- Same treatment as the signed-in staff header: primary top rule, pale bar,
       "Staff" chip. Contents share the max-w-6xl measure used everywhere else
       so the product name lines up with the content column below. -->
  <header class="border-b border-surface-200 border-t-4 border-t-primary-600 bg-surface-0">
    <div class="mx-auto flex w-full max-w-6xl items-center gap-3 px-4 py-3">
      <span class="text-lg font-semibold tracking-tight text-primary-700">
        {{ 'app.name' | translate: i18n.lang() }}
      </span>
      <span class="rounded-full bg-surface-100 px-2 py-0.5 text-xs font-medium text-surface-600">
        {{ 'nav.staffArea' | translate: i18n.lang() }}
      </span>

      <span class="flex-1"></span>

      <!-- The only language toggle on this page. -->
      <button type="button"
        class="rounded-md px-2.5 py-1.5 text-sm font-medium text-primary-600
               hover:bg-primary-50 hover:text-primary-700 transition-colors"
        (click)="i18n.toggle()">
        {{ 'lang.switchTo' | translate: i18n.lang() }}
      </button>
    </div>
  </header>

  <main class="flex flex-1 items-center justify-center p-4">
    <router-outlet />
  </main>
</div>
