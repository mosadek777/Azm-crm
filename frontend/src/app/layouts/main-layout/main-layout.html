<!-- STAFF SHELL. spec 012 FR-002, FR-005.
     A sidebar plus a slim top bar, replacing the top-bar-only navigation.

     WHY THE CHANGE. The top bar held two links and the product has thirteen
     modules. It does not scale horizontally, and it breaks sooner in Arabic
     than the English labels suggest. Administration will need a group with
     several children, which a horizontal bar cannot hold at all.

     The CUSTOMER PORTAL keeps its top bar — see portal-layout.html. A customer
     has two screens.

     WIDTH DISCIPLINE. `min-w-0` on the content column is load-bearing: a flex
     child defaults to `min-width: auto`, so a wide table inside it would push
     the column — and the page — wider than the window rather than scrolling in
     its own frame. That is exactly how every staff screen came to scroll
     sideways at 390px before. -->
<div class="min-h-screen bg-surface-50 lg:flex">

  <app-sidebar class="contents" />

  <div class="flex min-h-screen min-w-0 flex-1 flex-col">
    <!-- Top bar: identity, language, account. Navigation has moved out of it.
         It keeps the primary top rule and the "Staff" chip, because telling the
         two interfaces apart at a glance still matters most to a customer who
         should never wonder whether they are on a staff screen. -->
    <header class="sticky top-0 z-20 border-b border-surface-200 border-t-4 border-t-primary-600
                   bg-surface-0/95 backdrop-blur">
      <div class="flex w-full flex-wrap items-center gap-x-3 gap-y-2 px-4 py-3">

        <!-- Drawer trigger. Below the large breakpoint only; it shares state
             with the panel through SidebarState. -->
        <button type="button"
          class="inline-flex items-center gap-2 rounded-md border border-surface-300 bg-surface-0
                 px-2.5 py-1.5 text-sm text-surface-700 hover:bg-surface-100 lg:hidden
                 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
          [attr.aria-expanded]="sidebar.drawerOpen()"
          aria-controls="staff-nav"
          [attr.aria-label]="'nav.openMenu' | translate: i18n.lang()"
          (click)="sidebar.openDrawer()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        <!-- `lg:hidden`: above the breakpoint the sidebar's brand block carries
             the product name, and printing it twice on one screen is exactly
             the duplication the sidebar was meant to remove. Below it the panel
             is off-canvas, so the header is the only place the name appears. -->
        <span class="text-lg font-semibold tracking-tight text-primary-700 lg:hidden">
          {{ 'app.name' | translate: i18n.lang() }}
        </span>
        <span class="rounded-full bg-surface-100 px-2 py-0.5 text-xs font-medium text-surface-600">
          {{ 'nav.staffArea' | translate: i18n.lang() }}
        </span>

        <span class="flex-1"></span>

        <!-- THE LANGUAGE TOGGLE AND THE USER MENU HAVE MOVED to the foot of
             the sidebar. One place to look for "me" beats two, and the header
             now carries only the product identity and the drawer trigger. -->
      </div>
    </header>

    <!-- Content. `min-w-0` again for the same reason as the column above. -->
    <main class="w-full min-w-0 flex-1 px-4 py-6">
      <div class="mx-auto w-full max-w-6xl">
        <router-outlet />
      </div>
    </main>

    <footer class="border-t border-surface-200 bg-surface-0 px-4 py-3 text-center
                   text-sm text-surface-500">
      {{ 'app.name' | translate: i18n.lang() }} — v0.1.0
    </footer>
  </div>
</div>

<!-- 012 FR-016 / PLT-15. Mounted once per shell; a fixed layer, so it never
     moves the page beneath it. -->
<app-toast-host />
