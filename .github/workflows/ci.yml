# Continuous integration — spec 013 FR-008, story NFR-08.
#
# 245 checks existed and nothing ran them. A suite nobody runs protects nothing,
# which made this the cheapest high-value item in the project.
#
# ⚠ THE AWKWARD PART, STATED RATHER THAN WORKED AROUND QUIETLY.
#
# This project REQUIRES MongoDB as a replica set. That is not a preference:
# constitution II requires every change and its audit record to commit together
# in one all-or-nothing operation, and MongoDB only offers transactions on a
# replica set. A standalone server would drop that guarantee silently, and the
# connection string carries `?replicaSet=rs0` so a misconfigured set fails
# loudly at connect rather than at the first transaction.
#
# GitHub Actions `services:` CANNOT express this. A service container accepts
# docker *options* but no *command*, so there is no way to start mongod with
# `--replSet rs0`, and no way to run `rs.initiate()` before the health check
# passes. This is a limitation of the services mechanism, not of MongoDB.
#
# Three ways round it were considered:
#   1. a third-party action that wraps this — adds a dependency on somebody
#      else's action for the one thing that gates every test;
#   2. a custom image with the replica set baked in — a second artefact to
#      build, publish and keep in step with the server version;
#   3. start the container directly in a step — a few lines, no dependency.
#
# (3) is used below. It is slightly more verbose than `services:` and it is
# honest about what it does.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: a run against superseded
# code tells nobody anything and costs the same as a useful one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — acceptance suites and audit reconciliation
    runs-on: ubuntu-latest

    env:
      # Test-only values, generated here. NOTHING in this file is a real
      # credential: the repository holds none and never has, and the local .env
      # that holds the developer's own is not in version control.
      MONGO_URI: mongodb://localhost:27017/?replicaSet=rs0
      PORT: '3000'
      JWT_EXPIRES_IN: 8h
      SALT_ROUNDS: '10'          # lower than production purely for CI speed
      DEFAULT_COUNTRY_CODE: '+20'
      BREAKGLASS_EMAIL: ci-breakglass@azmsquad.test
      # 20 characters, comfortably over the ratified 12-character minimum.
      BREAKGLASS_PASSWORD: ci-only-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 \
            --replSet rs0 --bind_ip_all

          # Wait for the server to answer before initiating. A fixed sleep here
          # is the usual cause of a flaky pipeline, so this polls instead.
          for i in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' 2>/dev/null | grep -q 1; then
              echo "mongod answering after ${i}s"; break
            fi
            sleep 1
          done

          docker exec mongo mongosh --quiet --eval 'rs.initiate()'

          # And wait for the set to elect a primary. Transactions fail until it
          # has one, which would look like a test failure rather than a timing
          # problem.
          for i in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              echo "primary elected after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "no primary elected — transactions would fail, so stopping here"
          docker logs mongo | tail -40
          exit 1

      - name: Generate a signing secret for this run
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Install
        working-directory: backend
        run: npm ci

      # The suite starts and stops the API itself, drops the database between
      # suites and re-seeds the break-glass account, so nothing else is needed.
      - name: npm test — acceptance suites
        working-directory: backend
        run: npm test

      # Runs after the suite, against the database it leaves behind. It proves
      # no change exists without an audit record and no record without a change,
      # across every record type — constitution II, checked rather than trusted.
      - name: audit:reconcile
        working-directory: backend
        run: npm run audit:reconcile

      - name: MongoDB logs, if anything failed
        if: failure()
        run: docker logs mongo | tail -80

  frontend:
    name: Frontend — build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: ng build
        working-directory: frontend
        run: npx ng build

      - name: ng test
        working-directory: frontend
        run: npx ng test --watch=false

  # A guard rather than a test. The project's rule is that no credential ever
  # reaches a tracked file, because once committed it survives in history even
  # after removal. This checks the rule rather than trusting it.
  secrets:
    name: No credential in a tracked file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env must not be tracked
        run: |
          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "backend/.env is tracked — it holds real credentials and must not be"
            exit 1
          fi
          echo "backend/.env is not tracked"

      - name: No assigned value for a credential key in any tracked file
        run: |
          # Matches an assignment with something after the '=', so a declaration
          # like `export const BREAKGLASS_PASSWORD = require_(...)` does not trip
          # it while `BREAKGLASS_PASSWORD=hunter2` does. .env.example holds keys
          # with empty values by design and is excluded.
          if git grep -nE '(BREAKGLASS_PASSWORD|JWT_SECRET|CLICKUP_TOKEN|DEMO_PASSWORD)=[^[:space:]"'"'"']' \
               -- . ':!backend/.env.example' ':!.github/workflows/ci.yml'; then
            echo "a credential appears to be assigned a value in a tracked file"
            exit 1
          fi
          echo "no credential assigned in any tracked file"
